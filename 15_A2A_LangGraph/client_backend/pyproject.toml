[project]
name = "a2a-client-backend"
version = "0.1.0"
description = "FastAPI client backend with LangGraph for A2A protocol demonstration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.2",
    "langgraph>=0.3.18",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.3.0",
    "httpx>=0.28.1",
    "a2a-sdk>=0.3.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["a2a_client_backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"